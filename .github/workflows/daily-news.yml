name: 每日新闻自动更新

on:
  schedule:
    # 每天 UTC 00:00 运行 = 北京时间 08:00
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # 允许在 GitHub 网页上手动点 “Run workflow” 触发

permissions:
  contents: write        # 允许工作流把生成的新闻 JSON 提交回仓库

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取并生成今日新闻
        run: python scripts/fetch_news.py

      - name: 提交并推送（如有变化）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cross-border-news-zh.json data/origin-news.json
          if git diff --cached --quiet; then
            echo "新闻无变化，跳过提交"
          else
            git commit -m "每日自动更新新闻 $(date +%F)"
            git push
            echo "已推送今日新闻更新"
          fi
